services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tradeledger
      POSTGRES_PASSWORD: tradeledger
      POSTGRES_DB: tradeledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeledger -d tradeledger"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
